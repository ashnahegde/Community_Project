<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Officials Dashboard</title><link rel="stylesheet" href="officials-dashboard.css"></head><body><header class="bar"><a class="brand" href="index.html"><b>ಗ್ರಾ</b> Gram Seva</a><div><select class="language"><option value="en">English</option><option value="kn">ಕನ್ನಡ</option></select> <button id="logout" class="out" data-en="Sign out" data-kn="ಲಾಗ್ ಔಟ್">Sign out</button></div></header><main class="wrap"><div class="welcome"><div><small class="eyebrow" data-en="OFFICIAL WORKSPACE" data-kn="ಅಧಿಕೃತ ಕಾರ್ಯಸ್ಥಳ">OFFICIAL WORKSPACE</small><h1 data-en="Complaint dashboard" data-kn="ದೂರುಗಳ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್">Complaint dashboard</h1><p data-en="Review incoming concerns and keep residents informed." data-kn="ಸ್ವೀಕರಿಸಿದ ಸಮಸ್ಯೆಗಳನ್ನು ಪರಿಶೀಲಿಸಿ ಮತ್ತು ನಿವಾಸಿಗಳಿಗೆ ಮಾಹಿತಿ ನೀಡಿ.">Review incoming concerns and keep residents informed.</p></div><button id="refresh" class="refresh">↻ <span data-en="Refresh" data-kn="ರಿಫ್ರೆಶ್">Refresh</span></button></div><div class="stats"><article>📥 <small data-en="Total complaints" data-kn="ಒಟ್ಟು ದೂರುಗಳು">Total complaints</small><b id="total">0</b></article><article>🟡 <small data-en="Submitted" data-kn="ಸಲ್ಲಿಸಲಾಗಿದೆ">Submitted</small><b id="submitted">0</b></article><article>🔄 <small data-en="In progress" data-kn="ಪ್ರಗತಿಯಲ್ಲಿದೆ">In progress</small><b id="progress">0</b></article><article>✅ <small data-en="Resolved" data-kn="ಪರಿಹರಿಸಲಾಗಿದೆ">Resolved</small><b id="resolved">0</b></article></div><section class="panel"><div class="list-head"><div><h2 data-en="Recent complaints" data-kn="ಇತ್ತೀಚಿನ ದೂರುಗಳು">Recent complaints</h2><p data-en="Select a complaint to view and update it." data-kn="ದೂರನ್ನು ನೋಡಲು ಮತ್ತು ನವೀಕರಿಸಲು ಆಯ್ಕೆಮಾಡಿ.">Select a complaint to view and update it.</p></div><select id="filter"><option value="All" data-en="All statuses" data-kn="ಎಲ್ಲಾ ಸ್ಥಿತಿಗಳು">All statuses</option><option value="Submitted" data-en="Submitted" data-kn="ಸಲ್ಲಿಸಲಾಗಿದೆ">Submitted</option><option value="In Progress" data-en="In progress" data-kn="ಪ್ರಗತಿಯಲ್ಲಿದೆ">In progress</option><option value="Resolved" data-en="Resolved" data-kn="ಪರಿಹರಿಸಲಾಗಿದೆ">Resolved</option><option value="Rejected" data-en="Rejected" data-kn="ತಿರಸ್ಕರಿಸಲಾಗಿದೆ">Rejected</option></select></div><p id="notice" class="msg"></p><div id="list"></div></section><section class="panel" id="detail" hidden><div class="list-head"><h2 data-en="Complaint details" data-kn="ದೂರಿನ ವಿವರಗಳು">Complaint details</h2><button id="close" class="out">✕</button></div><div id="details" class="details"></div><form id="update"><label data-en="Update status" data-kn="ಸ್ಥಿತಿಯನ್ನು ನವೀಕರಿಸಿ">Update status</label><select id="newStatus"><option value="Submitted" data-en="Submitted" data-kn="ಸಲ್ಲಿಸಲಾಗಿದೆ">Submitted</option><option value="In Progress" data-en="In progress" data-kn="ಪ್ರಗತಿಯಲ್ಲಿದೆ">In progress</option><option value="Resolved" data-en="Resolved" data-kn="ಪರಿಹರಿಸಲಾಗಿದೆ">Resolved</option><option value="Rejected" data-en="Rejected" data-kn="ತಿರಸ್ಕರಿಸಲಾಗಿದೆ">Rejected</option></select><label data-en="Official remarks" data-kn="ಅಧಿಕಾರಿಗಳ ಟಿಪ್ಪಣಿ">Official remarks</label><textarea id="remarks" rows="3"></textarea><button class="primary" type="submit" data-en="Save changes" data-kn="ಬದಲಾವಣೆಗಳನ್ನು ಉಳಿಸಿ">Save changes</button><p id="updateMsg" class="msg"></p></form></section></main><script src="officials-dashboard.js"></script></body></html>
